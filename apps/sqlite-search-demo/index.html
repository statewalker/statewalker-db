<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQLite FTS5 + Vector Demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        padding: 0 16px;
      }
      input, button, textarea {
        font: inherit;
      }
      .row {
        display: flex;
        gap: 12px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .card {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 12px;
        margin: 10px 0;
      }
      .muted {
        color: #666;
      }
      code {
        background: #f5f5f5;
        padding: 2px 5px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>SQLite FTS5 + Vector Search</h1>

    <div class="row">
      <input id="textQuery" placeholder="Keyword query" size="32" value="sqlite search" />
      <button type="button" id="ftsBtn">FTS search</button>
    </div>

    <div class="row">
      <input id="vecQuery" placeholder='Vector JSON, e.g. [0.1,0.2,0.3,0.4]' size="42" value="[0.11,0.21,0.29,0.41]" />
      <button type="button" id="vecBtn">Vector search</button>
    </div>

    <div class="row">
      <input id="hybridTextQuery" placeholder="Hybrid text query" size="24" value="database search" />
      <input id="hybridVecQuery" placeholder='Hybrid vector JSON' size="30" value="[0.11,0.21,0.29,0.41]" />
      <button type="button" id="hybridBtn">Hybrid search</button>
    </div>

    <div class="row">
      <button type="button" id="resetBtn">Reset demo data</button>
    </div>

    <div id="status" class="muted">Starting…</div>
    <div id="results"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
